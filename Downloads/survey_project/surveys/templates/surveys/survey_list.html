{% if user.is_authenticated %}
  <p>
    Hola, {{ user.username }} |
    <form action="{% url 'logout' %}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit" class="link-button">Cerrar sesión</button>
    </form>
  </p>

  <p><a href="{% url 'surveys:create_survey' %}">Crear nueva encuesta</a></p>
{% else %}
  <p><a href="{% url 'login' %}">Iniciar sesión</a></p>
{% endif %}

<style>
.link-button{
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  color: #06c;
  text-decoration: underline;
  cursor: pointer;
  font: inherit;
}
</style>
